name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recording_studio_orderable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3']
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
      env:
        BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
    
    - name: Install dummy app dependencies
      run: bundle install
      working-directory: test/dummy
      env:
        BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_orderable_test
    
    - name: Run database migrations
      run: bundle exec rake db:migrate RAILS_ENV=test
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_orderable_test

    - name: Build dummy Tailwind
      run: bundle exec rails tailwindcss:build
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_orderable_test

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Run gem tests
      run: bundle exec rake app:test
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_orderable_test

    - name: Run dummy tests
      run: bundle exec rails test
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_orderable_test

    - name: Run dummy system tests
      run: bundle exec rails test:system
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_orderable_test

  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: true
      env:
        BUNDLE_GEMFILE: test/dummy/Gemfile
        BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

    - name: Bundler audit
      run: bin/bundler-audit
      working-directory: test/dummy

    - name: Brakeman
      run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      working-directory: test/dummy
