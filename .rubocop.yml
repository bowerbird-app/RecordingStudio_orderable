AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/gem_template/hooks.rb'
    - 'lib/recording_studio_orderable/sibling_order.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'

Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

Lint/MissingSuper:
  Exclude:
    - 'lib/gem_template/services/**/*'
    - 'test/services/**/*'
